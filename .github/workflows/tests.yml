name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ctest:
    # Starlet targets aarch64 Linux; the crash report decodes aarch64 registers only.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The packages of tools/replay/Dockerfile.
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build libegl-dev libgles-dev zlib1g-dev libegl-mesa0 libgl1-mesa-dri zstd ca-certificates
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
